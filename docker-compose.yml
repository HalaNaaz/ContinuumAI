version: '3.8'

services:
  # FalkorDB Primary Graph Database
  falkordb:
    image: falkordb/falkordb:latest
    container_name: continuumai_falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: continuumai_backend
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=continuum_ai
      - LLM_PROVIDER=mock
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    depends_on:
      - falkordb
    restart: unless-stopped

  # Next.js Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: continuumai_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
